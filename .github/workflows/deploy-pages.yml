name: Deploy portfolio to Pages

'on':
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build verified Pages artifact
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.3.0

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.14.0"
          test "$(npm --version)" = "11.3.0"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic checks
        run: npm run check

      - name: Audit external links
        run: npm run audit:external

      - name: Build configured Pages artifact
        env:
          VITE_BLOG_GIST_ID: ${{ vars.BLOG_GIST_ID }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy verified Pages artifact
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    name: Verify published portfolio
    if: github.ref == 'refs/heads/master'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.3.0

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.14.0"
          test "$(npm --version)" = "11.3.0"

      - name: Run published-site smoke
        run: npm run smoke:pages
